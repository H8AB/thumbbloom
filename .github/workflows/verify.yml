name: Verify

on:
  push:
  pull_request:

jobs:
  skill-and-examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm run examples
      - run: npm run workbuddy
      - run: npm run check
      - run: git diff --exit-code -- examples platforms/workbuddy
